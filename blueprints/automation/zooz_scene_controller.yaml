blueprint:
  name: "Zooz Scene Controller"
  description: >
    Simplify Zooz ZEN32 and ZEN35 scene controller setup. Select the controller
    device once — scene buttons are resolved automatically.

    Configure each corner button (Upper Left, Upper Right, Lower Left, Lower
    Right) with an action and optional target. LED status for scene buttons can
    use a separate status entity when control and sensor differ (e.g. garage doors).

    Light buttons: single tap toggles, double tap turns on (useful for groups
    where some lights may already be on manually).
    Automations and entity toggles respond to single tap only.

    LED colors: lights white/on, red/off; automations always blue; open/unlocked
    yellow; closed/locked green; disabled buttons off.

    Main button LED is configured directly on the device — no automation needed.

    Prerequisites: enable scene event entities on the device page. Parameter 23
    (Disable LED Flash On Setting Change) is optional — set to Disable if LED
    update flashes bother you.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  input:
    scene_controller:
      name: Scene Controller
      description: >
        The Zooz ZEN32 or ZEN35 device. Scene buttons and LED parameter targets
        are resolved from this selection.
      selector:
        device:
          filter:
            - integration: zwave_js
              manufacturer: Zooz
              model: ZEN32
            - integration: zwave_js
              manufacturer: Zooz
              model: ZEN32 800LR
            - integration: zwave_js
              manufacturer: Zooz
              model: ZEN35

    upper_left:
      name: Upper Left Button
      collapsed: false
      input:
        upper_left_action:
          name: Action
          description: >
            Single tap behavior. Light buttons also support double tap to turn
            on all lights (useful for groups where some may already be on).
            Automations and entity toggles respond to single tap only.
          default: none
          selector:
            select:
              options:
                - label: Disabled
                  value: none
                - label: Light or light group (tap toggle, double-tap on)
                  value: light_toggle
                - label: Trigger automation
                  value: automation
                - label: Toggle entity (e.g. garage door)
                  value: entity_toggle

        upper_left_target_entity:
          name: Target Entity
          description: >
            Light/group to toggle, automation to trigger, or entity to toggle.
            Ignored when Action is Disabled.
          default: ""
          selector:
            entity:
              domain:
                - light
                - switch
                - group
                - automation
                - cover
                - lock
                - fan
                - input_boolean

        upper_left_status_entity:
          name: LED Status Entity (optional)
          description: >
            Entity whose state drives the LED color. Leave blank to use the
            target entity. Useful when control and status are different devices
            (e.g. a garage door opener vs. a door sensor).
          default: ""
          selector:
            entity:

    upper_right:
      name: Upper Right Button
      collapsed: true
      input:
        upper_right_action:
          name: Action
          default: none
          selector:
            select:
              options:
                - label: Disabled
                  value: none
                - label: Light or light group (tap toggle, double-tap on)
                  value: light_toggle
                - label: Trigger automation
                  value: automation
                - label: Toggle entity (e.g. garage door)
                  value: entity_toggle

        upper_right_target_entity:
          name: Target Entity
          default: ""
          selector:
            entity:
              domain:
                - light
                - switch
                - group
                - automation
                - cover
                - lock
                - fan
                - input_boolean

        upper_right_status_entity:
          name: LED Status Entity (optional)
          default: ""
          selector:
            entity:

    lower_left:
      name: Lower Left Button
      collapsed: true
      input:
        lower_left_action:
          name: Action
          default: none
          selector:
            select:
              options:
                - label: Disabled
                  value: none
                - label: Light or light group (tap toggle, double-tap on)
                  value: light_toggle
                - label: Trigger automation
                  value: automation
                - label: Toggle entity (e.g. garage door)
                  value: entity_toggle

        lower_left_target_entity:
          name: Target Entity
          default: ""
          selector:
            entity:
              domain:
                - light
                - switch
                - group
                - automation
                - cover
                - lock
                - fan
                - input_boolean

        lower_left_status_entity:
          name: LED Status Entity (optional)
          default: ""
          selector:
            entity:

    lower_right:
      name: Lower Right Button
      collapsed: true
      input:
        lower_right_action:
          name: Action
          default: none
          selector:
            select:
              options:
                - label: Disabled
                  value: none
                - label: Light or light group (tap toggle, double-tap on)
                  value: light_toggle
                - label: Trigger automation
                  value: automation
                - label: Toggle entity (e.g. garage door)
                  value: entity_toggle

        lower_right_target_entity:
          name: Target Entity
          default: ""
          selector:
            entity:
              domain:
                - light
                - switch
                - group
                - automation
                - cover
                - lock
                - fan
                - input_boolean

        lower_right_status_entity:
          name: LED Status Entity (optional)
          default: ""
          selector:
            entity:

variables:
  scene_controller: !input scene_controller

  toggle_offset: 1
  color_offset: 6
  brightness_offset: 11
  led_brightness: "1"

  open_states: ["on", "open", "opening", "unlocked", "playing"]
  closed_states: ["off", "closed", "closing", "locked", "idle", "paused"]

  # Flat variables for use in the led_state condition filter
  upper_left_target: !input upper_left_target_entity
  upper_left_status: !input upper_left_status_entity
  upper_right_target: !input upper_right_target_entity
  upper_right_status: !input upper_right_status_entity
  lower_left_target: !input lower_left_target_entity
  lower_left_status: !input lower_left_status_entity
  lower_right_target: !input lower_right_target_entity
  lower_right_status: !input lower_right_status_entity

  # property_key matches Z-Wave central scene numbering (Scene 001–004)
  buttons:
    - id: upper_left
      property_key: "001"
      button_id: 1
      action: !input upper_left_action
      target: !input upper_left_target_entity
      status: !input upper_left_status_entity
    - id: upper_right
      property_key: "002"
      button_id: 2
      action: !input upper_right_action
      target: !input upper_right_target_entity
      status: !input upper_right_status_entity
    - id: lower_left
      property_key: "003"
      button_id: 3
      action: !input lower_left_action
      target: !input lower_left_target_entity
      status: !input lower_left_status_entity
    - id: lower_right
      property_key: "004"
      button_id: 4
      action: !input lower_right_action
      target: !input lower_right_target_entity
      status: !input lower_right_status_entity

trigger:
  # All central scene button presses from the selected device
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input scene_controller
      command_class_name: Central Scene
    id: scene_press

  # Scene button LED sync — watches all state_changed events and filters to
  # configured target/status entities in the action condition. Avoids the
  # save-time validation error from empty string entity IDs in platform:state.
  - platform: event
    event_type: state_changed
    id: led_state

  - platform: homeassistant
    event: start
    id: startup

  - platform: event
    event_type: automation_reloaded
    id: reload

action:
  - choose:
      # ── Scene button pressed ─────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: scene_press
        sequence:
          - variables:
              scene_key: >
                {% set raw = trigger.event.data.property_key_name
                   | default(trigger.event.data.property_key) | string %}
                {% if raw | length == 1 %}
                  {{ '00' ~ raw }}
                {% elif raw | length == 2 %}
                  {{ '0' ~ raw }}
                {% else %}
                  {{ raw }}
                {% endif %}
              value_raw: >
                {{ trigger.event.data.value_raw
                   | default(trigger.event.data.value) | int(0) }}
              btn: >
                {% set matched = buttons | selectattr('property_key', 'eq', scene_key) | list %}
                {{ matched[0] if matched | length > 0 else {} }}
          - choose:
              # Light toggle — single tap
              - conditions:
                  - condition: template
                    value_template: >
                      {{ btn.action | default('none') == 'light_toggle'
                         and btn.target | default('') != '' and value_raw == 0 }}
                sequence:
                  - service: homeassistant.toggle
                    target:
                      entity_id: "{{ btn.target }}"
              # Light toggle — double tap turns on
              - conditions:
                  - condition: template
                    value_template: >
                      {{ btn.action | default('none') == 'light_toggle'
                         and btn.target | default('') != '' and value_raw == 3 }}
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ btn.target }}"
              # Automation trigger — single tap
              - conditions:
                  - condition: template
                    value_template: >
                      {{ btn.action | default('none') == 'automation'
                         and btn.target | default('') != '' and value_raw == 0 }}
                sequence:
                  - service: automation.trigger
                    target:
                      entity_id: "{{ btn.target }}"
              # Entity toggle — single tap
              - conditions:
                  - condition: template
                    value_template: >
                      {{ btn.action | default('none') == 'entity_toggle'
                         and btn.target | default('') != '' and value_raw == 0 }}
                sequence:
                  - service: homeassistant.toggle
                    target:
                      entity_id: "{{ btn.target }}"
          # LED update handled by led_state trigger reacting to entity
          # state changes — no LED update needed here.

      # ── Scene button LED (state change) ──────────────────────────────────
      - conditions:
          - condition: trigger
            id: led_state
          - condition: template
            value_template: >
              {% set e = trigger.event.data.entity_id %}
              {{ e in [
                upper_left_target, upper_left_status,
                upper_right_target, upper_right_status,
                lower_left_target, lower_left_status,
                lower_right_target, lower_right_status
              ] and trigger.event.data.new_state is not none }}
        sequence:
          - variables:
              btn: >
                {% set e = trigger.event.data.entity_id %}
                {% set matched = buttons | selectattr('status', 'eq', e) | list %}
                {% set matched = matched if matched | length > 0
                   else buttons | selectattr('target', 'eq', e) | list %}
                {{ matched[0] if matched | length > 0 else {} }}
              led_entity: "{{ btn.status if btn.status != '' else btn.target }}"
              led_state: "{{ states(led_entity) if btn.action != 'automation' else 'automation' }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ btn.action == 'none' }}"
                sequence:
                  - service: zwave_js.set_config_parameter
                    target:
                      device_id: !input scene_controller
                    data:
                      parameter: "{{ btn.button_id | int + toggle_offset | int }}"
                      value: "2"
              - conditions:
                  - condition: template
                    value_template: "{{ btn.action == 'automation' }}"
                sequence:
                  - parallel:
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + toggle_offset | int }}"
                          value: "3"
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + color_offset | int }}"
                          value: "1"
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + brightness_offset | int }}"
                          value: "{{ led_brightness }}"
              - conditions:
                  - condition: template
                    value_template: "{{ btn.action == 'light_toggle' }}"
                sequence:
                  - parallel:
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + toggle_offset | int }}"
                          value: "3"
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + color_offset | int }}"
                          value: >
                            {% if led_state in open_states %}0{% else %}3{% endif %}
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + brightness_offset | int }}"
                          value: "{{ led_brightness }}"
              - conditions:
                  - condition: template
                    value_template: "{{ btn.action == 'entity_toggle' }}"
                sequence:
                  - parallel:
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + toggle_offset | int }}"
                          value: "3"
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + color_offset | int }}"
                          value: >
                            {% if led_state in closed_states %}2
                            {% elif led_state in open_states %}5
                            {% else %}3{% endif %}
                      - service: zwave_js.set_config_parameter
                        target:
                          device_id: !input scene_controller
                        data:
                          parameter: "{{ btn.button_id | int + brightness_offset | int }}"
                          value: "{{ led_brightness }}"

      # ── Startup / reload: refresh all scene button LEDs ──────────────────
      - conditions:
          - condition: trigger
            id:
              - startup
              - reload
        sequence:
          - if:
              - condition: trigger
                id: startup
            then:
              - delay:
                  seconds: 30
          - repeat:
              for_each: "{{ buttons }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item.action == 'none' }}"
                      sequence:
                        - service: zwave_js.set_config_parameter
                          target:
                            device_id: !input scene_controller
                          data:
                            parameter: "{{ repeat.item.button_id | int + toggle_offset | int }}"
                            value: "2"
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item.action == 'automation' }}"
                      sequence:
                        - parallel:
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + toggle_offset | int }}"
                                value: "3"
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + color_offset | int }}"
                                value: "1"
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + brightness_offset | int }}"
                                value: "{{ led_brightness }}"
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item.action == 'light_toggle' }}"
                      sequence:
                        - variables:
                            led_entity: >
                              {{ repeat.item.status if repeat.item.status != '' else repeat.item.target }}
                            led_state: "{{ states(led_entity) }}"
                        - parallel:
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + toggle_offset | int }}"
                                value: "3"
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + color_offset | int }}"
                                value: >
                                  {% if led_state in open_states %}0{% else %}3{% endif %}
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + brightness_offset | int }}"
                                value: "{{ led_brightness }}"
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item.action == 'entity_toggle' }}"
                      sequence:
                        - variables:
                            led_entity: >
                              {{ repeat.item.status if repeat.item.status != '' else repeat.item.target }}
                            led_state: "{{ states(led_entity) }}"
                        - parallel:
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + toggle_offset | int }}"
                                value: "3"
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + color_offset | int }}"
                                value: >
                                  {% if led_state in closed_states %}2
                                  {% elif led_state in open_states %}5
                                  {% else %}3{% endif %}
                            - service: zwave_js.set_config_parameter
                              target:
                                device_id: !input scene_controller
                              data:
                                parameter: "{{ repeat.item.button_id | int + brightness_offset | int }}"
                                value: "{{ led_brightness }}"

mode: queued
max_exceeded: silent